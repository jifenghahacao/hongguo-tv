<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>红果短剧 · 分享</title>
<style>
:root{--red:#ff2d55}
*{box-sizing:border-box;margin:0}
body{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;background:linear-gradient(170deg,#12101a,#1c1226 55%,#241530);color:#f2f2f5;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:22px}
.card{max-width:340px;width:100%}
.poster{position:relative;width:100%;aspect-ratio:3/4;border-radius:18px;overflow:hidden;background:linear-gradient(150deg,#2a2a45,#5a3a7a);box-shadow:0 18px 50px rgba(0,0,0,.55)}
.poster img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.poster .mask{position:absolute;left:0;right:0;bottom:0;padding:44px 16px 14px;background:linear-gradient(transparent,rgba(0,0,0,.82))}
.poster h1{font-size:20px;font-weight:800;line-height:1.35;word-break:break-all;text-shadow:0 1px 6px rgba(0,0,0,.6)}
.poster .sub{font-size:12px;color:rgba(255,255,255,.75);margin-top:5px}
.badge{position:absolute;top:12px;left:12px;display:flex;align-items:center;gap:6px;padding:6px 11px;border-radius:20px;background:rgba(0,0,0,.5);backdrop-filter:blur(6px);font-size:12px;font-weight:600}
.badge .dot{width:18px;height:18px;border-radius:5px;background:linear-gradient(135deg,var(--red),#ff8a3d);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800}
.btns{margin-top:20px}
.btn{display:block;width:100%;padding:15px;border-radius:28px;font-size:16px;font-weight:700;text-decoration:none;text-align:center;margin-bottom:12px}
.btn-go{background:linear-gradient(90deg,#ff5a5a,#ff8a3d);color:#fff;border:none}
.btn-dl{background:rgba(255,255,255,.08);color:#cfcfda;border:1px solid rgba(255,255,255,.14);font-weight:500;font-size:14px}
.tip{font-size:12.5px;color:#9a9aa6;line-height:1.9;margin-top:6px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:13px 15px;display:none}
.tip b{color:#ffb0b0}
</style>
</head>
<body>
<div class="card">
  <div class="poster" id="poster">
    <div class="badge"><span class="dot">红</span>红果短剧</div>
    <img id="cover" alt="" style="display:none">
    <div class="mask"><h1 id="title">红果短剧</h1><div class="sub" id="sub">好剧大家看 · 免费短剧全集在线</div></div>
  </div>
  <div class="btns">
    <button class="btn btn-go" id="open">打开 App 免费看全集</button>
    <a class="btn btn-dl" id="dl" href="https://github.com/jifenghahacao/hongguo-tv/releases/latest">尚未安装？下载红果短剧 App</a>
    <div class="tip" id="tip">
      <b>微信内打开：</b>点右上角「···」→「在浏览器打开」，即可自动跳转 App 直达本剧。<br>
      已安装 App 的手机在浏览器中会<b>直接打开 App</b>，无需任何网页。
    </div>
  </div>
</div>
<script>
(function () {
  var q = new URLSearchParams(location.search);
  var id = q.get("id") || "";
  var t = q.get("t") || "";
  if (t) {
    // Title arrives base64url-encoded to keep the shared link short.
    try {
      var b64 = t.replace(/-/g, "+").replace(/_/g, "/");
      while (b64.length % 4) b64 += "=";
      t = decodeURIComponent(escape(atob(b64)));
    } catch (e) { /* keep raw */ }
  }
  var c = "";
  if (t) { document.getElementById("title").textContent = "《" + t + "》"; document.title = t + " · 红果短剧"; }  // Cover cannot ride in the link (signed URLs are huge and expire), so
  // best-effort: scrape the official detail page for its og:image via a CORS
  // relay. Any failure silently keeps the branded gradient.
  if (id && /^\d{6,32}$/.test(id)) {
    var target = "https://hongguoduanju.com/detail?series_id=" + id;
    fetch("https://api.allorigins.win/raw?url=" + encodeURIComponent(target))
      .then(function (r) { return r.text(); })
      .then(function (h) {
        var m = /property="og:image"[^>]*content="([^"]+)"/.exec(h) || /content="([^"]+)"[^>]*property="og:image"/.exec(h);
        if (m && /^https:\/\//.test(m[1])) {
          var im = document.getElementById("cover");
          im.onerror = function () { im.remove(); };
          im.src = m[1].replace(/&amp;/g, "&"); im.style.display = "block";
        }
      }).catch(function () { });
  }
  var deep = "hongguo://series/" + encodeURIComponent(id);
  function tryOpen() { location.href = deep; }
  document.getElementById("open").addEventListener("click", tryOpen);
  if (navigator.userAgent.toLowerCase().indexOf("micromessenger") !== -1) {
    document.getElementById("tip").style.display = "block";
  } else if (id) {
    setTimeout(tryOpen, 400);
  }
})();
</script>
</body>
</html>
