<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b0b10">
<title>红果漫剧</title>
<style>
:root{
  --bg:#0b0b10; --panel:#16161d; --panel2:#1e1e27; --line:rgba(255,255,255,.08);
  --txt:#f2f2f5; --sub:#9a9aa6; --red:#ff2d55; --orange:#ff6b23; --gold:#f5c869;
  --tabbar-h:56px; --safe-b:env(safe-area-inset-bottom,0px); --dm-area:25%;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;background:var(--bg);color:var(--txt);overflow:hidden;user-select:none;-webkit-user-select:none}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;display:block}
button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer}
img{display:block}
input,textarea{user-select:auto;-webkit-user-select:auto}
.app{position:fixed;inset:0;overflow:hidden}
.pages{position:absolute;inset:0 0 var(--tabbar-h) 0;overflow:hidden}
.page{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;display:none;-webkit-overflow-scrolling:touch;scrollbar-width:none;overscroll-behavior:contain}
.page::-webkit-scrollbar{display:none}
.page.active{display:block}
.page.no-scroll{overflow:hidden}
.tabbar{position:absolute;left:0;right:0;bottom:0;height:calc(var(--tabbar-h) + var(--safe-b));padding-bottom:var(--safe-b);display:flex;background:rgba(12,12,16,.92);backdrop-filter:blur(18px);border-top:1px solid var(--line);z-index:50}
.tabbar.hidden{display:none}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:#8b8b96;font-size:14px}
.tab.active{color:#fff;font-weight:600}
.home-indicator{display:none;width:16px;height:3px;border-radius:2px;background:#fff;margin-top:1px}
.tab.home-tab.active .home-indicator{display:block}
.icon-btn{width:38px;height:38px;border-radius:50%;background:rgba(0,0,0,.34);border:1px solid rgba(255,255,255,.16);display:flex;align-items:center;justify-content:center;flex:none}
.icon-btn .ic{width:19px;height:19px}
.icon-btn:active{transform:scale(.9)}
.icon-btn.on{background:rgba(255,255,255,.3)}
/* HOME FEED */
#page-home{background:#000}
.feed{height:100%;overflow-y:auto;scroll-snap-type:y mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none;overscroll-behavior:contain}
.feed::-webkit-scrollbar{display:none}
.feed-item{position:relative;height:100%;scroll-snap-align:start;scroll-snap-stop:always;overflow:hidden}
.fi-scene{position:absolute;inset:0;background:#000}
.fi-scene .bg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.4) 0%,rgba(0,0,0,0) 30%,rgba(0,0,0,.15) 55%,rgba(0,0,0,.78) 100%)}
.fi-video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1;background:#000;opacity:0;transition:opacity .22s}
.fi-video.playing{opacity:1}
.fi-scene .bg{position:absolute;inset:0;background-size:cover;background-position:center;filter:saturate(1.05);opacity:0;transition:opacity .4s}
.fi-scene .bg.on{opacity:1}
.fi-video.landscape{object-fit:contain}
.fi-spin{position:absolute;left:50%;top:50%;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;border:3px solid rgba(255,255,255,.22);border-top-color:#fff;animation:fi-spin-rot .8s linear infinite;z-index:5;pointer-events:none}
@keyframes fi-spin-rot{to{transform:rotate(360deg)}}
.fi-top{position:absolute;top:0;left:0;right:0;height:64px;display:flex;align-items:center;justify-content:space-between;padding:26px 14px 0;z-index:10}
.fi-tabs{display:flex;gap:18px;font-size:15px;color:rgba(255,255,255,.55)}
.fi-tabs span{padding-bottom:4px;transition:color .25s}
.fi-tabs .on{color:#fff;font-weight:700;font-size:16px;border-bottom:2px solid #fff}
.fi-danmaku{position:absolute;left:14px;bottom:216px;z-index:10;padding:8px 14px;border-radius:20px;background:rgba(0,0,0,.42);border:1px solid rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:600}
.fi-danmaku.on{background:rgba(255,255,255,.28)}
.fi-info{position:absolute;left:14px;right:80px;bottom:100px;z-index:10}
.fi-side{position:absolute;right:10px;bottom:78px;display:flex;flex-direction:column;gap:10px;z-index:10;align-items:center}
.fi-title{font-size:18px;font-weight:700;text-shadow:0 1px 6px rgba(0,0,0,.6);margin-bottom:6px}
.fi-tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.fi-tags span{font-size:10px;padding:3px 8px;border-radius:5px;background:rgba(255,255,255,.14);color:rgba(255,255,255,.85)}
.fi-desc{font-size:12px;color:rgba(255,255,255,.72);line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.fi-act{display:flex;flex-direction:column;align-items:center;gap:2px;color:#fff;padding:5px 4px;min-width:46px;min-height:46px;justify-content:center}
.fi-act .ic{width:30px;height:30px;filter:drop-shadow(0 1px 4px rgba(0,0,0,.5))}
.fi-act small{font-size:10px;color:rgba(255,255,255,.85);text-shadow:0 1px 4px rgba(0,0,0,.6)}
.fi-act.liked{color:var(--red)}
.fi-act.faved{color:var(--gold)}
.fi-act.casting{color:var(--red)}
#p-cast.casting{color:var(--red)}
.cast-dev{display:flex;align-items:center;gap:10px;width:100%;padding:14px 6px;border-bottom:1px solid var(--line);color:var(--txt);font-size:15px;text-align:left}
.cast-dev .ic{width:20px;height:20px;color:var(--sub)}
.cast-dev:active{background:var(--panel2)}
.cast-empty{padding:18px 6px;font-size:13px;color:var(--sub);line-height:1.7}
.cast-now{display:flex;align-items:center;gap:10px;padding:12px 6px;font-size:14px}
.cast-stop{margin-left:auto;padding:7px 14px;border-radius:8px;background:rgba(255,45,85,.18);color:var(--red);font-size:13px;font-weight:600}
.cast-refresh{width:100%;margin-top:14px;padding:11px;border-radius:10px;background:var(--panel2);color:var(--sub);font-size:13px}
.fi-watch{position:absolute;left:14px;right:14px;bottom:calc(6px + var(--safe-b));z-index:10;display:flex;align-items:center;gap:9px;height:36px;padding:0 16px;border-radius:10px;background:rgba(0,0,0,.45);color:#fff;font-size:13px;font-weight:600;border:1px solid rgba(255,255,255,.12)}
.fi-watch .ic{width:16px;height:16px}
.fi-watch:active{transform:scale(.95)}
.fi-full-btn{position:absolute;left:50%;transform:translateX(-50%);bottom:216px;z-index:10;display:none;align-items:center;gap:6px;padding:8px 14px;border-radius:20px;background:rgba(0,0,0,.42);color:#fff;font-size:12px;font-weight:600;border:1px solid rgba(255,255,255,.2)}
.fi-full-btn.show{display:flex}
.fi-full-btn .ic{width:15px;height:15px}
.fi-full-btn:active{transform:translateX(-50%) scale(.95)}
.fi-seek{position:absolute;left:0;right:0;bottom:calc(48px + var(--safe-b));height:26px;z-index:14;display:flex;align-items:center;padding:0 14px;touch-action:none}
.fi-seek .track{position:relative;flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.22)}
.fi-seek .track i{position:absolute;left:0;top:0;bottom:0;border-radius:2px;background:#fff;width:0}
.feed-seek-ov{position:absolute;inset:0;z-index:30;display:none;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,.92)}
.feed-seek-ov.show{display:flex}
.feed-seek-ov .fso-card{width:190px;border-radius:10px;overflow:hidden;background:#111;border:1px solid rgba(255,255,255,.15)}
.feed-seek-ov .fso-card img{width:100%;height:106px;object-fit:cover;display:block}
.feed-seek-ov .fso-time{margin-top:14px;font-size:17px;color:rgba(255,255,255,.55)}
.feed-seek-ov .fso-time b{color:#fff;font-weight:600}
.feed-seek-ov .fso-bar{position:absolute;left:20px;right:20px;bottom:62px;height:6px;border-radius:3px;background:rgba(255,255,255,.28)}
.feed-seek-ov .fso-bar i{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:3px;background:#fff}
.feed-seek-ov .fso-bar i b{position:absolute;right:-7px;top:50%;transform:translateY(-50%);width:14px;height:14px;border-radius:50%;background:#fff}
.fi-play{position:absolute;inset:0;display:none;align-items:center;justify-content:center;z-index:8}
.fi-play.show{display:flex}
.fi-play .icon-btn{width:80px;height:80px;background:none}
.fi-play .ic{width:64px;height:64px;fill:#fff;stroke:none;filter:drop-shadow(0 2px 10px rgba(0,0,0,.5))}
/* generic pages */
.page-head{padding:14px 16px 6px;font-size:20px;font-weight:700;display:flex;align-items:center;justify-content:space-between}
.page-head .sub{font-size:11px;color:var(--sub);font-weight:400}
.cover{position:relative;aspect-ratio:3/4;border-radius:10px;overflow:hidden;background:linear-gradient(150deg,var(--c1,#2a2a45),var(--c2,#5a3a7a));display:flex;align-items:center;justify-content:center;flex:none}
.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1;opacity:0;transition:opacity .3s}
.cover img.ready{opacity:1}
.cover::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.06),transparent 40%,rgba(0,0,0,.55));z-index:2}
.cover-art{display:none}
.cover.has-img .cover-art{display:none}
.cover-foot{position:absolute;left:0;right:0;bottom:0;padding:6px;z-index:3;font-size:10px;color:rgba(255,255,255,.9)}
.cover-ep{position:absolute;top:6px;right:6px;z-index:3;font-size:9px;background:rgba(0,0,0,.5);padding:2px 6px;border-radius:4px}
.rank-page{position:fixed;inset:0;background:var(--bg);z-index:60;display:flex;flex-direction:column;visibility:hidden;pointer-events:none;opacity:0;transform:translateY(26px);transition:opacity .22s ease,transform .22s ease,visibility 0s linear .22s}
.rank-page.open{visibility:visible;pointer-events:auto;opacity:1;transform:none;transition:opacity .22s ease,transform .22s ease}
.rp-head{display:flex;align-items:center;gap:10px;padding:calc(12px + env(safe-area-inset-top,0px)) 14px 2px}
.rp-head .icon-btn{width:32px;height:32px;background:transparent}
.rp-head .icon-btn:first-child{transform:rotate(90deg)}
.rp-tabs{display:flex;gap:16px;font-size:15px;color:rgba(255,255,255,.55);flex:1;white-space:nowrap}
.rp-tabs span{padding-bottom:6px;position:relative}
.rp-tabs .on{color:#fff;font-weight:700;font-size:16px}
.rp-tabs .on::after{content:"";position:absolute;left:50%;transform:translateX(-50%);bottom:0;width:18px;height:3px;border-radius:2px;background:var(--red)}
.rp-body{flex:1;overflow-y:auto;scrollbar-width:none;overscroll-behavior:contain}
.rp-body::-webkit-scrollbar{display:none}
.rp-title-row{display:flex;align-items:center;justify-content:space-between;padding:12px 16px 0}
.rp-title-row h2{font-size:26px;margin:0;font-weight:800}
.rp-chips{display:flex;gap:10px;overflow-x:auto;padding:14px 16px 6px;scrollbar-width:none}
.rp-chips::-webkit-scrollbar{display:none}
.rp-chip{flex:none;font-size:14px;color:var(--txt);padding:7px 16px;border-radius:8px;background:transparent;border:1px solid transparent;transition:transform .12s}
.rp-chip:active{transform:scale(.93)}
.rp-chip.on{color:var(--red);font-weight:700;background:rgba(255,45,85,.1);border-color:rgba(255,45,85,.45)}
.rp-note{font-size:11px;color:var(--sub);padding:6px 16px 10px}
.rp-list{padding:0 12px 24px;display:flex;flex-direction:column;gap:18px}
#rp-list .rank-card{display:flex;gap:14px;align-items:stretch}
#rp-list .rank-card .cover{width:112px;flex:none}
#rp-list .rank-card .info{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center}
#rp-list .rank-card .rt{font-size:19px;font-weight:700;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
#rp-list .rank-card .rs{margin-top:10px;font-size:13px;color:var(--sub)}
#rp-list .rank-card .tags,#rp-list .rank-card .play-btn{display:none}
.rp-badge{position:absolute;top:0;left:0;z-index:4;background:linear-gradient(135deg,#ff5a5a,#ff2d55);color:#fff;font-size:11px;font-weight:700;padding:3px 10px;border-radius:0 0 10px 0}
.rank-bar{display:flex;align-items:center;justify-content:space-between;padding:10px 16px 4px}
.rank-bar b{font-size:17px}
.rank-bar button{font-size:12px;color:var(--sub);background:var(--panel2);padding:6px 12px;border-radius:14px}
.rank-opt{display:flex;align-items:center;justify-content:space-between;width:100%;padding:15px 4px;border-bottom:1px solid var(--line);font-size:15px;font-weight:600}
.rank-opt small{font-size:11px;color:var(--sub);font-weight:400}
.rank-tabs{display:flex;gap:22px;padding:6px 16px 10px;font-size:15px;color:var(--sub)}
.rank-tabs span{padding-bottom:5px;position:relative}
.rank-tabs .on{color:#fff;font-weight:700}
.rank-tabs .on::after{content:"";position:absolute;left:50%;transform:translateX(-50%);bottom:0;width:18px;height:3px;border-radius:2px;background:var(--red)}
.rank-list{padding:0 12px 20px;display:flex;flex-direction:column;gap:14px}
.rank-group-title{font-size:15px;font-weight:700;padding:6px 4px 0;display:flex;align-items:center;gap:6px}
.rank-group-title .ic{width:16px;height:16px;color:var(--red)}
.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.card{position:relative;transition:transform .15s}
.card:active{transform:scale(.97)}
.card .cover{margin-bottom:6px}
.card-title{font-size:13px;font-weight:600;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-sub{font-size:10px;color:var(--sub);margin-top:2px}
.rank-card{display:flex;gap:12px;align-items:flex-start;transition:transform .15s}
.rank-card:active{transform:scale(.98)}
.rank-card .cover{width:96px}
.rank-card .info{flex:1;min-width:0;padding-top:2px}
.rank-card .rt{font-size:15px;font-weight:700;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.rank-card .rs{font-size:11px;color:var(--sub);margin-top:4px}
.rank-card .tags{display:flex;gap:5px;margin-top:8px;flex-wrap:wrap}
.rank-card .tags span{font-size:10px;color:var(--sub);background:var(--panel2);padding:2px 7px;border-radius:4px}
.rank-card .play-btn{margin-top:10px;background:linear-gradient(90deg,var(--orange),var(--red));color:#fff;font-size:12px;font-weight:700;padding:6px 16px;border-radius:14px}
.section{padding:0 16px 18px}
.section-title{font-size:16px;font-weight:700;margin:10px 0 12px;display:flex;justify-content:space-between;align-items:center}
.section-title small{font-size:11px;color:var(--sub);font-weight:400}
.cat-tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.cat-tile{aspect-ratio:1.6;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:13px;font-weight:600;color:#fff;background:linear-gradient(150deg,var(--c1),var(--c2));box-shadow:0 4px 14px rgba(0,0,0,.35)}
.cat-tile .ic{width:22px;height:22px;opacity:.9}
.cat-tile:active{transform:scale(.96)}
.list{display:flex;flex-direction:column}
.list-item{display:flex;gap:12px;padding:12px 16px;align-items:center;border-bottom:1px solid rgba(255,255,255,.05)}
.list-item .cover{width:64px}
.list-item .li-info{flex:1;min-width:0}
.list-item .li-t{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list-item .li-s{font-size:11px;color:var(--sub);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list-item .go{color:var(--sub);font-size:12px;display:flex;align-items:center;gap:2px}
.list-item .go .ic{width:14px;height:14px}
/* MINE */
.mine-head{padding:20px 16px 12px;display:flex;align-items:center;gap:12px}
.avatar{width:56px;height:56px;border-radius:50%;background:linear-gradient(140deg,#ff6b23,#ff2d55);display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:800;flex:none;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
.mine-head .mh-info{flex:1}
.mine-head .mh-name{font-size:16px;font-weight:700}
.mine-head .mh-sub{font-size:11px;color:var(--sub);margin-top:3px}
.mine-head .login-btn{background:#fff;color:#111;font-size:13px;font-weight:700;padding:8px 18px;border-radius:18px}
.stats{display:flex;margin:6px 16px 14px;background:var(--panel);border-radius:14px;padding:14px 0}
.stat{flex:1;text-align:center}
.stat b{display:block;font-size:18px;font-weight:800}
.stat span{font-size:11px;color:var(--sub)}
.set-row{display:flex;align-items:center;padding:14px 16px;border-bottom:1px solid rgba(255,255,255,.05);font-size:14px}
.set-row:last-child{border-bottom:0}
.set-row .ic{width:18px;height:18px;color:var(--sub);margin-right:10px;flex:none}
.set-row .sr-label{flex:1;text-align:left}
.set-row .sr-val{color:var(--sub);font-size:12px;display:flex;align-items:center;gap:2px;margin-left:auto;flex:none}
.set-row .sr-val .ic{width:13px;height:13px;margin-right:0}
/* grouped settings cards on the Mine page */
.settings{padding:2px 16px 18px}
.set-group{background:var(--panel);border-radius:14px;overflow:hidden;margin-bottom:14px}
.set-group-title{font-size:11px;color:var(--sub);padding:2px 6px 7px;font-weight:600;letter-spacing:.5px}
.switch{width:44px;height:25px;border-radius:13px;background:#3a3a44;position:relative;transition:background .2s;flex:none}
/* in-app update dialog */
.upd-mask{position:fixed;inset:0;background:rgba(0,0,0,.66);z-index:120;display:flex;align-items:center;justify-content:center;padding:28px}
.upd-dialog{width:100%;max-width:320px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;animation:upd-in .18s ease}
@keyframes upd-in{from{transform:scale(.92);opacity:0}to{transform:none;opacity:1}}
.upd-title{font-size:16px;font-weight:700}
.upd-meta{font-size:11px;color:var(--sub);margin-top:6px;line-height:1.6}
.upd-notes{margin-top:12px;max-height:38vh;overflow-y:auto;font-size:12px;line-height:1.8;color:rgba(255,255,255,.82);background:var(--panel2);border-radius:10px;padding:10px 12px;scrollbar-width:none}
.upd-notes::-webkit-scrollbar{display:none}
.upd-bar{margin-top:14px;height:8px;border-radius:4px;background:rgba(255,255,255,.12);overflow:hidden}
.upd-bar i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,var(--orange),var(--red));transition:width .3s}
.upd-btns{display:flex;gap:10px;margin-top:16px}
.upd-btns button{flex:1;padding:11px 0;border-radius:11px;font-size:14px;font-weight:600}
.upd-btns .upd-cancel{background:var(--panel2);color:var(--sub)}
.upd-btns .upd-ok{background:var(--red);color:#fff}
.upd-btns .upd-ok:active{transform:scale(.97)}
.switch::after{content:"";position:absolute;top:2.5px;left:2.5px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .2s}
.switch.on{background:var(--red)}
.switch.on::after{transform:translateX(19px)}
/* PLAYER */
.player{position:absolute;inset:0;z-index:100;background:#000;display:flex;flex-direction:column;visibility:hidden;pointer-events:none;opacity:0;transition:opacity .2s ease,visibility 0s linear .2s}
.player.open{visibility:visible;pointer-events:auto;opacity:1;transition:opacity .2s ease}
.p-scene{position:relative;flex:1;overflow:hidden;background:#000;touch-action:none}
@keyframes pLeaveUp{to{transform:translateY(-26%);opacity:0}}
@keyframes pLeaveDown{to{transform:translateY(26%);opacity:0}}
@keyframes pEnterUp{from{transform:translateY(26%);opacity:0}to{transform:none;opacity:1}}
@keyframes pEnterDown{from{transform:translateY(-26%);opacity:0}to{transform:none;opacity:1}}
.p-scene.p-leave-up{animation:pLeaveUp .24s ease-in forwards}
.p-scene.p-leave-down{animation:pLeaveDown .24s ease-in forwards}
.p-scene.p-enter-up{animation:pEnterUp .4s cubic-bezier(.2,.8,.25,1)}
.p-scene.p-enter-down{animation:pEnterDown .4s cubic-bezier(.2,.8,.25,1)}
.p-scene .bg{position:absolute;inset:0;background-size:cover;background-position:center;filter:blur(2px) saturate(1.1);opacity:.5}
.p-video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;z-index:1;background:#000}
.p-video.p-preload{opacity:0}
.p-bridge{position:absolute;inset:0;z-index:2;background:#000 center/contain no-repeat;opacity:0;visibility:hidden;transition:opacity .3s ease,visibility 0s linear .3s;pointer-events:none}

.lg-tabs{display:flex;gap:8px;margin:2px 2px 14px}
.lg-tab{flex:1;padding:10px 0;border-radius:10px;background:var(--panel2);color:var(--sub);font-size:14px;font-weight:600}

.sms-box{padding:4px 8px 20px;display:flex;flex-direction:column;gap:12px}

.toast.show{opacity:1}

.top-tip{position:absolute;left:50%;top:calc(env(safe-area-inset-top,0px) + 34px);transform:translate(-50%,0);background:rgba(0,0,0,.78);color:#fff;padding:11px 20px;border-radius:12px;font-size:14px;font-weight:600;z-index:320;opacity:0;pointer-events:none;transition:opacity .2s;white-space:nowrap}
.top-tip.show{opacity:1}

.top-tip.bl{left:14px;top:auto;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);transform:none;padding:6px 12px;border-radius:10px;font-size:12px;font-weight:500;background:rgba(0,0,0,.45)}

.boost-cancel-txt.show{opacity:1}
.loading{padding:30px;text-align:center;color:var(--sub);font-size:12px}
.sk{position:relative;overflow:hidden;background:#17171f;border-radius:10px}

@keyframes shimmer{to{transform:translateX(100%)}}
.sk-card{aspect-ratio:3/4;border-radius:10px}

<div class="app">
  <div class="pages">
    <section class="page no-scroll active" id="page-home">
      <div class="feed" id="feed"></div>
      <div class="fi-seek" id="fi-seek"><div class="track"><i id="fi-seek-fill"></i></div></div>
      <div class="feed-seek-ov" id="feed-seek-ov">
        <div class="fso-card"><img id="fso-img" alt=""></div>
        <div class="fso-time" id="fso-time"><b>00:00</b>/00:00</div>
        <div class="fso-bar"><i id="fso-fill"><b></b></i></div>
      </div>
    </section>
    <section class="page" id="page-theater"></section>
    <section class="page" id="page-mine"></section>
    <section class="page" id="page-search"></section>
  </div>
  <nav class="tabbar" id="tabbar">
    <button class="tab home-tab active" data-tab="home"><span>首页</span><span class="home-indicator"></span></button>
    <button class="tab" data-tab="theater"><span>剧场</span></button>
    <button class="tab" data-tab="mine"><span>我的</span></button>
  </nav>
  <div class="cmt-panel home-cmt" id="h-cmt-panel">
    <div class="cmt-head">
      <button class="cmt-x" id="h-cmt-close"><svg class="ic"><use href="#i-close"/></svg></button>
      <div class="cmt-count" id="h-cmt-count">评论</div>
      <button class="cmt-down" id="h-cmt-down"><svg class="ic"><use href="#i-chevdown"/></svg></button>
    </div>
    <div class="cmt-list" id="h-cmt-list"></div>
    <div class="cmt-input"><input id="h-cmt-text" maxlength="500" placeholder="有趣评论千千万，不如你也来一条？"><button id="h-cmt-send">发送</button></div>
  </div>
  <div class="player" id="player">
    <div class="p-scene" id="p-scene">
      <div class="bg" id="p-bg"></div>
      <video class="p-video" id="p-video" playsinline></video>
      <div class="p-bridge" id="p-bridge"></div>
      <div class="p-hud" id="p-hud"></div>
      <div class="p-danmaku-layer" id="p-danmaku-layer"></div>
      <div class="p-center-play" id="p-center-play"><button class="icon-btn"><svg class="ic"><use href="#i-play"/></svg></button></div>
      <button class="p-toggle" id="p-toggle"><svg class="ic"><use href="#i-pause"/></svg></button>
      <div class="p-top">
        <button class="icon-btn" id="p-back"><svg class="ic"><use href="#i-back"/></svg></button>
        <div class="p-title" id="p-title"></div>
        <button class="icon-btn" id="p-cast"><svg class="ic"><use href="#i-cast"/></svg></button>
      </div>
      <button class="p-full" id="p-full" style="display:none"><svg class="ic"><use href="#i-full"/></svg>全屏播放</button>
      <div class="p-sub" id="p-sub"></div>
      <div class="p-bottom">
        <div class="p-line">
          <svg class="ic"><use href="#i-drama"/></svg>
          <div class="p-title2" id="p-title2"></div>
          <div class="p-ep-title" id="p-ep-title"></div>
        </div>
        <input type="range" class="p-seek" id="p-seek" min="0" max="1000" value="0">
        <div class="p-times"><span id="p-cur">00:00</span><span id="p-dur">00:00</span></div>
        <div class="p-actions">
          <button class="p-btn" id="p-eps"><svg class="ic"><use href="#i-eps"/></svg><span>选集</span></button>
          <button class="p-btn" id="p-danmaku"><svg class="ic"><use href="#i-danmaku"/></svg><span>弹幕</span></button>
          <button class="p-btn" id="p-cmt"><svg class="ic"><use href="#i-msg"/></svg><span>评论</span></button>
          <button class="p-btn" id="p-speed"><svg class="ic"><use href="#i-speed"/></svg><span id="p-speed-n">倍速</span></button>
          <button class="p-btn" id="p-quality"><svg class="ic"><use href="#i-grid"/></svg><span id="p-quality-n">画质</span></button>
        </div>
      </div>
    </div>
    <div class="cmt-panel" id="cmt-panel">
      <div class="cmt-head">
        <button class="cmt-x" id="cmt-close"><svg class="ic"><use href="#i-close"/></svg></button>
        <div class="cmt-count" id="cmt-count">评论</div>
        <button class="cmt-down" id="cmt-down"><svg class="ic"><use href="#i-chevdown"/></svg></button>
      </div>
      <div class="cmt-list" id="cmt-list"></div>
      <div class="cmt-input"><input id="cmt-text" maxlength="500" placeholder="有趣评论千千万，不如你也来一条？"><button id="cmt-send">发送</button></div>
    </div>
  </div>
  <div class="detail" id="detail">
    <div class="d-head"><button class="icon-btn" id="d-back"><svg class="ic"><use href="#i-back"/></svg></button><div class="t" id="d-head-title"></div></div>
    <div class="d-scroll">
      <div class="d-hero"><div class="d-poster" id="d-poster"></div>
        <div class="d-info"><div class="d-name" id="d-name"></div><div class="d-sub2" id="d-sub2"></div><div class="d-tags" id="d-tags"></div></div></div>
      <div class="d-btns"><button class="d-play" id="d-play">开始追剧</button><button class="d-follow" id="d-follow">+ 追剧</button></div>
      <div class="d-intro" id="d-intro"></div>
      <div id="d-seasons"></div>
      <div class="d-sec" id="d-eps-title">选集</div>
      <div class="d-epgrid" id="d-epgrid"></div>
    </div>
  </div>
  <div class="drawer-mask" id="drawer-mask"></div>
  <aside class="drawer" id="drawer">
    <div class="drawer-head">
      <div class="avatar">漫</div>
      <div style="flex:1">
        <div class="dh-name">红果漫剧</div>
        <div class="dh-sub">好剧免费 · 全集畅看</div>
      </div>
      <button class="icon-btn" id="drawer-close"><svg class="ic"><use href="#i-close"/></svg></button>
    </div>
    <div class="drawer-sec">
      <div class="ds-title">我的内容</div>
      <button class="d-item" data-drawer="history"><svg class="ic"><use href="#i-clock"/></svg>观看历史</button>
      <button class="d-item" data-drawer="favorites"><svg class="ic"><use href="#i-star"/></svg>我的收藏</button>
      <button class="d-item" data-drawer="follows"><svg class="ic"><use href="#i-bookmark"/></svg>我的追更</button>
    </div>
    <div class="drawer-sec">
      <div class="ds-title">应用设置</div>
      <button class="d-item" data-drawer="quality"><svg class="ic"><use href="#i-grid"/></svg>默认画质</button>
      <button class="d-item" data-drawer="auto"><svg class="ic"><use href="#i-play"/></svg>自动播下一集</button>
      <button class="d-item" data-drawer="danmaku"><svg class="ic"><use href="#i-danmaku"/></svg>弹幕开关</button>
      <button class="d-item" data-drawer="dmarea"><svg class="ic"><use href="#i-danmaku"/></svg>弹幕屏幕占比</button>
      <button class="d-item" data-drawer="about"><svg class="ic"><use href="#i-gear"/></svg>关于</button>
    </div>
  </aside>
  <div class="rank-page" id="rank-page">
    <div class="rp-head"><button class="icon-btn" id="rp-back"><svg class="ic"><use href="#i-chev"/></svg></button>
      <div class="rp-tabs"></div>
      <button class="icon-btn" id="rp-search"><svg class="ic"><use href="#i-search"/></svg></button>
    </div>
    <div class="rp-body">
      <div class="rp-title-row"><h2 id="rp-h2">排行榜</h2></div>
      <div class="rp-chips" id="rp-chips"></div>
      <div class="rp-note" id="rp-note">榜单每日更新 · 点击剧目直接观看</div>
      <div class="rp-list" id="rp-list"></div>
    </div>
  </div>
  <div class="sheet-wrap" id="sheet-wrap">
    <div class="sheet-mask" id="sheet-mask"></div>
    <div class="sheet">
      <div class="sheet-head"><span id="sheet-title">选择</span><button class="close" id="sheet-close">关闭</button></div>
      <div class="sheet-body" id="sheet-body"></div>
    </div>
  </div>
  <div class="top-tip" id="top-tip"></div>
  <div class="boost-hint" id="boost-hint"><b>2倍速快进中</b><span>上滑锁定倍速 · 拖到下方取消</span></div>
    <svg class="boost-cancel" id="boost-cancel" viewBox="0 0 100 30" preserveAspectRatio="none"><path d="M 0 30 Q 50 30 100 30 Z"/></svg>
  <div class="boost-cancel-txt" id="boost-cancel-txt">取消倍速</div>
  <div class="toast" id="toast"></div>
</div>
<script src="mobile-app.js"></script>
</body>
</html>
